services:
  - type: web
    name: medxplain-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/setup_model.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_DOWNLOAD_URL
        sync: false

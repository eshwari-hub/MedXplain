services:
  - type: web
    name: medxplain-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/setup_model.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/eshwari-hub/MedXplain/releases/download/model-v1/best_densenet121.keras
      - key: CORS_ORIGINS
        sync: false
